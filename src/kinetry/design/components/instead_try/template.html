<div class="cx">
  {{ t('eyebrow', tag='span', cls='eyebrow') }}
  <div class="pair">
    <div class="card box was">
      {% if has('instead_label') %}{{ t('instead_label') }}{% else %}<div class="tx r-label">Instead of</div>{% endif %}
      <div class="wq">{{ t('instead', split=False) }}<svg class="strike draw" viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M2 13 C 30 8, 60 15, 98 6" stroke="var(--bad)" stroke-width="5" vector-effect="non-scaling-stroke"/></svg></div>
    </div>
    <svg class="arrow draw" viewBox="0 0 100 100"><path d="M30 6 C 80 24, 86 60, 52 92" stroke="var(--ink)" stroke-width="7"/><path d="M34 74 L 52 93 L 76 84" stroke="var(--ink)" stroke-width="7"/></svg>
    <div class="card box now">
      {% if has('try_label') %}{{ t('try_label') }}{% else %}<div class="tx r-label">Try</div>{% endif %}
      {{ t('try') }}
    </div>
  </div>
</div>
