<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fernhill Academy — Learn together, lead better</title>
  <meta property="og:site_name" content="Fernhill Academy">
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital@0;1&display=swap">
  <style>
    :root { --brand: #0f766e; --brand-dark: #115e59; --spark: #f97316; --ink: #0b1f1d; --paper: #f7faf9; }
    body { font-family: "DM Sans", system-ui, sans-serif; color: #0b1f1d; background: #f7faf9; }
    h1, h2, .display { font-family: "Lora", Georgia, serif; color: #0b1f1d; }
    a, .link { color: #0f766e; }
    .btn { background: #0f766e; color: #ffffff; border-radius: 10px; }
    .btn:hover { background: #115e59; }
    .badge { background: #f97316; color: #ffffff; }
    .hero { background: linear-gradient(#f7faf9, #e7f2ef); }
    .card { border: 1px solid #d6e4e0; border-radius: 14px; }
    .muted { color: #4b635e; }
    .accent-line { border-color: #0f766e; }
    .tag { background: #ccfbf1; color: #115e59; }
    .spark { color: #f97316; }
    .nav a { color: #0f766e; font-family: "DM Sans", sans-serif; }
  </style>
</head>
<body>
  <header class="nav"><a class="link" href="/">Fernhill Academy</a></header>
  <section class="hero"><h1>Learn together, lead better</h1><a class="btn" href="/demo">Book a demo</a></section>

</html>
